{% extends 'base.html' %}
{% block title %}{{ 'Editar' if mesero else 'Nuevo' }} Mesero — El Buen Sabor{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Editar Mesero' if mesero else 'Nuevo Mesero' }}</h1>
  <a href="{{ url_for('admin.meseros_lista') }}" class="btn btn-outline">← Volver</a>
</div>

<div class="form-card">
  <form method="POST">
    <div class="form-group">
      <label>Nombre Completo</label>
      <input type="text" name="nombre" value="{{ mesero.nombre if mesero else '' }}" required placeholder="Ej: Juan Pérez">
    </div>
    <div class="form-group">
      <label>Teléfono</label>
      <input type="text" name="telefono" value="{{ mesero.telefono if mesero else '' }}" placeholder="Ej: 3001234567">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
      {{ 'Guardar Cambios' if mesero else 'Registrar Mesero' }}
    </button>
  </form>
</div>
{% endblock %}
