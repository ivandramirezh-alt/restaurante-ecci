{% extends 'base.html' %}
{% block title %}Nuevo Usuario — El Buen Sabor{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Crear Nuevo Usuario</h1>
  <a href="{{ url_for('admin.usuarios_lista') }}" class="btn btn-outline">← Volver</a>
</div>

<div class="form-card">
  <form method="POST">
    <div class="form-group">
      <label>Nombre Completo</label>
      <input type="text" name="nombre" required placeholder="Ej: Maria López">
    </div>
    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" name="correo" required placeholder="ejemplo@restaurante.com">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" required placeholder="Mínimo 6 caracteres">
    </div>
    <div class="form-group">
      <label>Rol del Usuario</label>
      <select name="rol" required>
        <option value="admin">Administrador</option>
        <option value="mesero">Mesero (App)</option>
        <option value="cajero">Cajero</option>
        <option value="cocinero">Cocinero</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
      <i class="fas fa-user-plus"></i> Registrar Usuario
    </button>
  </form>
</div>
{% endblock %}
